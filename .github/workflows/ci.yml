name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - development

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check test database secret
        run: |
          if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
            echo "::error::TEST_DATABASE_URL repository secret is not set. Add it under Settings -> Secrets and variables -> Actions using a Supabase pooled connection string (tests are isolated in the 'test' schema)."
            exit 1
          fi
        shell: bash

      - name: Test
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_SSL: 'true'
